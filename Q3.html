<!DOCTYPE html>
<html>
<head> 
    <title>Question3</title>
</head>
<body>
    <h2>Javascript for loop</h2>
    <p id="demo"></p>
    <script>
        let text ="";
        for(let i =1;i<=5;i++){
            text += "The Number is " + i + "<br>";
        }
        document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
